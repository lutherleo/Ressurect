[project]
name = "resume-jev"
version = "0.1.0"
description = "Job-targeted resume builder: Jev selects components, deterministic code renders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
resume = "resume_jev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_jev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
